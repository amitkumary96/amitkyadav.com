name: Deploy Production (FTPS)

# Two entry points, one implementation:
#   - a push to master (the ordinary path)
#   - called by publish-to-production.yml after it promotes staging
#
# The second matters because a push made with the default GITHUB_TOKEN does not
# trigger other workflows. Relying on `on: push` to fire after an automated merge
# would have silently never deployed.
on:
  push:
    branches:
      - master
  # Manual retry. An FTP transfer that dies partway leaves the site half-updated,
  # and the fix is simply to run it again — which needed a trigger that did not
  # depend on inventing a commit.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        default: master
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        shell: bash
        env:
          # Stated explicitly rather than relying on the default, so the two
          # workflows can be read side by side and the difference is obvious.
          SITE_URL: https://amitkyadav.com
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # Same reasoning as the staging workflow: a failed build leaves the live
      # site serving the previous version with no trace a writer would find.
      - name: Explain what went wrong
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Production was not updated"
            echo
            echo "The build failed, so the live site still shows the previous version."
            echo "**Nothing is lost.** Fix the point below and publish again."
            echo
            echo '```'
            grep -iE "does not match collection schema|InvalidContent|^[A-Za-z].*(needs a|must (start|be)|is not in|required|invalid)" build.log               | grep -viE "^npm|^>" | sort -u | head -15 || tail -25 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Hostinger (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state-production.json
          # The staging subdomain's document root is /public_html/staging, which
          # sits inside the directory this job syncs. Excluding it stops a
          # production deploy from ever treating the whole staging site as
          # extraneous files and removing it. The first four patterns are the
          # action's own defaults, restated because naming `exclude` replaces them.
          #
          # A literal block (|-), not a folded one (>-). Folded YAML joins these
          # onto a single line, and the action splits its patterns on newlines —
          # so as originally written the whole list became one meaningless glob
          # and nothing was actually excluded.
          exclude: |-
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-sync-state-*.json
            staging/**
            staging/
          # An interrupted transfer is the failure mode seen in practice, twice.
          # A longer per-operation timeout gives a slow or briefly unhappy server
          # room to finish rather than dropping the deploy halfway and leaving
          # empty directories serving 403.
          timeout: 120000
