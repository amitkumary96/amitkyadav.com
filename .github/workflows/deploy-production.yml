name: Deploy Production (FTPS)

# Two entry points, one implementation:
#   - a push to master (the ordinary path)
#   - called by publish-to-production.yml after it promotes staging
#
# The second matters because a push made with the default GITHUB_TOKEN does not
# trigger other workflows. Relying on `on: push` to fire after an automated merge
# would have silently never deployed.
on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        default: master
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Stated explicitly rather than relying on the default, so the two
          # workflows can be read side by side and the difference is obvious.
          SITE_URL: https://amitkyadav.com
        run: npm run build

      - name: Deploy to Hostinger (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state-production.json
          # The staging subdomain's document root is /public_html/staging, which
          # sits inside the directory this job syncs. Excluding it stops a
          # production deploy from ever treating the whole staging site as
          # extraneous files and removing it. The first four patterns are the
          # action's own defaults, restated because naming `exclude` replaces them.
          exclude: >-
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-sync-state-*.json
            staging/**
            staging/
