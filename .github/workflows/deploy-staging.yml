name: Deploy Staging (FTPS)

on:
  push:
    branches:
      - staging
  # Manual trigger, so a deploy that failed for a reason unrelated to the code —
  # a host outage, a refused FTP connection — can be retried without inventing a
  # commit to push. Re-running an old run replays that run's commit; this always
  # builds the current tip of staging.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Without this the staging build advertises production canonicals and
          # omits noindex — and because the subdomain's document root sits inside
          # public_html, the same pages also answer at amitkyadav.com/staging/,
          # giving search engines two copies of the same writing.
          SITE_URL: https://staging.amitkyadav.com
          # Staging is the writing desk: show unfinished work here. Draft pages
          # are noindex regardless and stay out of the sitemap and feed.
          SHOW_DRAFTS: 'true'
        run: npm run build

      - name: Deploy to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/staging/
          state-name: .ftp-deploy-sync-state-staging.json
