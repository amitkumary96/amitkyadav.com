name: Deploy Staging (FTPS)

on:
  push:
    branches:
      - staging
  # Manual trigger, so a deploy that failed for a reason unrelated to the code —
  # a host outage, a refused FTP connection — can be retried without inventing a
  # commit to push. Re-running an old run replays that run's commit; this always
  # builds the current tip of staging.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        shell: bash
        env:
          # Without this the staging build advertises production canonicals and
          # omits noindex — and because the subdomain's document root sits inside
          # public_html, the same pages also answer at amitkyadav.com/staging/,
          # giving search engines two copies of the same writing.
          SITE_URL: https://staging.amitkyadav.com
          # Staging is the writing desk: show unfinished work here. Draft pages
          # are noindex regardless and stay out of the sitemap and feed.
          SHOW_DRAFTS: 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # A failed build means the site was not rebuilt, so it silently keeps
      # serving the previous version. That is the correct behaviour — a broken
      # post must never reach the site — but it used to leave no trace anywhere
      # a writer would look. This turns the failure into a readable explanation
      # on the run page, which is what the failure email links to.
      - name: Explain what went wrong
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## This change was not published"
            echo
            echo "The site was not rebuilt, so it still shows the previous version."
            echo "**Nothing is lost.** Your writing is saved — fix the point below and press Save again."
            echo
            echo "### What the build objected to"
            echo
            echo '```'
            grep -iE "does not match collection schema|InvalidContent|^[A-Za-z].*(needs a|must (start|be)|is not in|required|invalid)" build.log \
              | grep -viE "^npm|^>" | sort -u | head -15 || tail -25 build.log
            echo '```'
            echo
            echo "Most causes are a field left half-filled — a cover image with no description,"
            echo "a series part with no number, or a recitation path that does not point at a real file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/staging/
          state-name: .ftp-deploy-sync-state-staging.json
