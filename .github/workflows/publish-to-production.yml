name: Promote Staging to Production

# Moves code and design changes from staging into master, then deploys.
#
# Content does not travel this way. Content is written in the production editor
# and commits straight to master, so master is the trunk: it always holds the
# live writing. staging is a working branch for code, taken from master and
# merged back.
#
# That is why this merges rather than fast-forwards. master legitimately moves on
# its own every time a post is written, so staging is almost never a direct
# descendant of it, and demanding a fast-forward would fail constantly.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be promoted, then stop
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.merge.outputs.promoted }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge staging into master
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin staging

          pending="$(git log --oneline master..origin/staging)"
          if [ -z "$pending" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to promote — master already contains everything on staging."
            exit 0
          fi

          {
            echo "### Promoting to amitkyadav.com"
            echo
            echo '```'
            echo "$pending"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — nothing was pushed."
            exit 0
          fi

          # --no-ff keeps a single, findable commit for each promotion, so the
          # history reads as a series of releases rather than interleaved work.
          if ! git merge --no-ff --no-edit -m "release: promote staging to production" origin/staging; then
            {
              echo "### Promotion stopped on a conflict"
              echo
              echo "The same file was changed on both branches. Nothing was published."
              echo "Resolve it locally, then run this again:"
              echo
              echo '```'
              echo "git checkout master && git pull"
              echo "git merge origin/staging   # fix the conflicts it reports"
              echo "git push origin master"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push origin master
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: promote
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/deploy-production.yml
    with:
      ref: master
    secrets: inherit
